services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trustinmuebles
      POSTGRES_USER: trustinmuebles
      POSTGRES_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustinmuebles"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/trustinmuebles
      DB_USER: trustinmuebles
      DB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
      APP_JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env (mínimo 32 caracteres)}
      APP_STORAGE_KEY: ${STORAGE_KEY:?define STORAGE_KEY en .env}
      APP_SEED_ENABLED: ${SEED_ENABLED:-true}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,https://jesus-torres1111.github.io}
    volumes:
      - uploads:/app/data/uploads
    ports:
      - "8080:8080"

volumes:
  pgdata:
  uploads:
