# Catálogo de explicaciones en lenguaje llano (REQ-NF01: sin jerga legal).
DOM_TITULAR_DISTINTO.titulo=El vendedor no figura como dueño
DOM_TITULAR_DISTINTO.explicacion=En el registro, la propiedad aparece a nombre de otra persona o empresa distinta de quien la ofrece en venta.
DOM_TITULAR_DISTINTO.recomendacion=No pagues nada. Pide al vendedor que acredite su derecho (poder inscrito o título) y consulta con un abogado.

DOM_AREA_DISCREPANTE.titulo=El área no coincide con el registro
DOM_AREA_DISCREPANTE.explicacion=Los metros cuadrados anunciados difieren en más de 5 % de los inscritos. Puede haber construcción sin declarar o un error en el anuncio.
DOM_AREA_DISCREPANTE.recomendacion=Solicita una verificación de medidas y la regularización registral antes de firmar.

DOM_CARGA_TECNICA.titulo=Hay una carga técnica anotada
DOM_CARGA_TECNICA.explicacion=El registro tiene una anotación técnica (por ejemplo, observaciones de planos o servidumbres) que limita el uso del inmueble.
DOM_CARGA_TECNICA.recomendacion=Pide que el vendedor explique la carga y verifica que no afecte tu uso o futura reventa.

DOM_DATOS_INCOMPLETOS.titulo=No hay datos suficientes del registro
DOM_DATOS_INCOMPLETOS.explicacion=No pudimos confirmar quién es el dueño actual porque la partida no tiene un asiento de dominio claro.
DOM_DATOS_INCOMPLETOS.recomendacion=Solicita una copia literal actualizada antes de continuar.

GRAV_HIPOTECA.titulo=La propiedad tiene una hipoteca vigente
GRAV_HIPOTECA.explicacion=El inmueble responde por una deuda con un banco u otra entidad. Si no se levanta, el acreedor mantiene derecho sobre la casa aunque cambie de dueño.
GRAV_HIPOTECA.recomendacion=Exige que la hipoteca se cancele con el pago de la venta y que el levantamiento quede inscrito.

GRAV_EMBARGO.titulo=La propiedad está embargada
GRAV_EMBARGO.explicacion=Un juez o acreedor ha trabado la propiedad para cobrar una deuda. Comprarla ahora te expone a perderla o a asumir la deuda.
GRAV_EMBARGO.recomendacion=No avances hasta que el embargo sea levantado e inscrito en el registro.

PROC_MEDIDA_CAUTELAR.titulo=Hay una medida judicial vigente
PROC_MEDIDA_CAUTELAR.explicacion=Existe una orden judicial que restringe vender o disponer de la propiedad mientras dura un proceso.
PROC_MEDIDA_CAUTELAR.recomendacion=No compres hasta que el proceso termine o la medida sea retirada.

PROC_DEMANDA.titulo=Hay una demanda anotada sobre la propiedad
PROC_DEMANDA.explicacion=Alguien inició un juicio que discute el derecho sobre este inmueble. Si pierde el vendedor, podrías perder la casa.
PROC_DEMANDA.recomendacion=No compres mientras el juicio siga abierto.

PROC_BLOQUEO.titulo=La partida está bloqueada por el registro
PROC_BLOQUEO.explicacion=El registro bloqueó la partida temporalmente, normalmente por sospecha de fraude o por un trámite en disputa. No se puede inscribir ninguna venta.
PROC_BLOQUEO.recomendacion=No pagues nada. Consulta con SUNARP y con un abogado antes de continuar.

# Traducción de cada asiento registral a lenguaje simple
asiento.DOMINIO=Indica quién es el dueño actual y cómo lo adquirió.
asiento.HIPOTECA=Es una garantía por una deuda: el banco puede ejecutar la propiedad si no se paga.
asiento.EMBARGO=Es una retención judicial de la propiedad para asegurar el cobro de una deuda.
asiento.MEDIDA_CAUTELAR=Es una orden de un juez que limita lo que se puede hacer con la propiedad.
asiento.BLOQUEO=El registro frenó temporalmente los trámites sobre esta propiedad para prevenir fraudes.
asiento.DEMANDA=Hay un juicio en curso que puede afectar quién es el dueño.
asiento.CARGA_TECNICA=Es una anotación técnica que limita o condiciona el uso del inmueble.
