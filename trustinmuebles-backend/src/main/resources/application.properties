spring.application.name=trustinmuebles-backend
server.port=8080
# Solo escucha en localhost: es un MVP local con cuentas de prueba, no un servicio publicado.
server.address=127.0.0.1

# --- Base de datos: H2 en archivo, ejecución local (no requiere instalar nada) ---
spring.datasource.url=jdbc:h2:file:./data/h2/trustinmuebles;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Documentos PDF (v0.8, decisión 4) ---
# Entrada de hasta 25 MB; si supera 5 MB se optimiza automáticamente; lo guardado no puede pasar de 10 MB.
app.archivos.max-entrada-mb=25
app.archivos.umbral-optimizacion-mb=5
app.archivos.max-almacenado-mb=10
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
# Tomcat lee el resto de una subida rechazada para poder responder 413 en lugar de cortar la conexión.
server.tomcat.max-swallow-size=30MB
app.storage.path=./data/uploads
app.storage.key=clave-local-de-cifrado-solo-desarrollo

# --- Seguridad (valores de desarrollo local; se pueden sustituir por variables de entorno) ---
app.jwt.secret=${APP_JWT_SECRET:trustinmuebles-secreto-de-desarrollo-local-minimo-32-bytes}
app.jwt.ttl-hours=8
app.cors.allowed-origins=http://localhost:5173

# --- Contenido y cuentas de prueba ---
# Versión de reglas activa: debe existir en src/main/resources/contenido/<versión>/
app.reglas.version=v0.4
app.seed.enabled=true
# Sin valor por defecto: define APP_SEED_PASSWORD (mínimo 8 caracteres) antes del primer arranque.
app.seed.password=${APP_SEED_PASSWORD:}

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
