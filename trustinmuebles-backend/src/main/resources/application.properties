spring.application.name=trustinmuebles-backend
server.port=8080

# --- Base de datos: H2 (modo PostgreSQL) por defecto; perfil "postgres" para docker-compose ---
spring.datasource.url=jdbc:h2:file:./data/h2/trustinmuebles;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Archivos ---
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
app.storage.path=./data/uploads
app.storage.key=cambia-esta-clave-de-cifrado-en-produccion

# --- Seguridad ---
app.jwt.secret=trustinmuebles-secreto-de-desarrollo-minimo-32-bytes-no-usar-en-produccion
app.jwt.ttl-hours=12
app.cors.allowed-origins=http://localhost:5173,https://jesus-torres1111.github.io

# --- Datos demo (usuarios, trámites, tickets) ---
app.seed.enabled=true
app.seed.password=demo1234

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
