# Construye y publica las imágenes en GitHub Container Registry (ghcr.io) en cada push a main.
name: Imágenes Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - nombre: trustinmuebles-backend
            contexto: ./trustinmuebles-backend
          - nombre: trustinmuebles-frontend
            contexto: ./trustinmuebles
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          push: true
          tags: |
            ghcr.io/ansufati2211/${{ matrix.nombre }}:latest
            ghcr.io/ansufati2211/${{ matrix.nombre }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nombre }}
